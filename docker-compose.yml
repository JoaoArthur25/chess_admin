# Local PostgreSQL for development.
#   docker compose up -d      start
#   docker compose down       stop (keeps data)
#   docker compose down -v    stop and wipe the volume
#
# Port 5433 on the host — deliberately NOT the default 5432, so this never
# collides with another Postgres already running on the machine.
services:
  db:
    image: postgres:16-alpine
    container_name: chess-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_admin
    ports:
      - '5433:5432'
    volumes:
      - chess-admin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chess -d chess_admin']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chess-admin-pgdata:
